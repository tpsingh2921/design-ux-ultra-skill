<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" fill="none">
  <title>Design UX Ultra Skill Logo Lockup</title>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="logoMarkGrad" x1="48" y1="36" x2="168" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="210" y1="60" x2="620" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="210" y1="120" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="glow" x="20" y="20" width="180" height="180" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      font-weight: 500;
      letter-spacing: 0.15em;
    }
  </style>

  <!-- Canvas Surface Background -->
  <rect width="800" height="200" rx="32" fill="url(#bgCanvas)"/>
  <rect width="800" height="200" rx="32" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Left Iconic Mark Group -->
  <g transform="translate(36, 24)">
    <!-- Squircle Container -->
    <rect x="0" y="0" width="152" height="152" rx="38" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Outer Glow Accent -->
    <circle cx="76" cy="76" r="48" fill="#6366F1" opacity="0.12" filter="url(#glow)"/>

    <!-- "U" Spatial Glyph -->
    <path d="M42 46C42 40 47 35 53 35H64C70 35 75 40 75 46V92C75 98 80 103 86 103C92 103 97 98 97 92V46C97 40 102 35 108 35H119C125 35 130 40 130 46V92C130 116 110 135 86 135C62 135 42 116 42 92V46Z" fill="url(#logoMarkGrad)"/>
  </g>

  <!-- Brand Typography Lockup -->
  <g transform="translate(228, 50)">
    <!-- Eyebrow Pill Tag -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1E293B" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#10B981"/>
    <text x="24" y="17" fill="#818CF8" class="subtitle-text" font-size="10">AI CODING AGENT SKILL</text>

    <!-- Version Badge -->
    <rect x="188" y="0" width="60" height="26" rx="13" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="202" y="17" fill="#22D3EE" class="subtitle-text" font-size="10">v1.2.0</text>

    <!-- Main Title -->
    <text x="0" y="66" fill="url(#textGrad)" class="title-text" font-size="38">
      DESIGN UX <tspan fill="#6366F1">ULTRA</tspan>
    </text>

    <!-- Subtitle / Foundation Tags -->
    <text x="0" y="92" fill="#64748B" class="subtitle-text" font-size="11">
      DRIBBBLE • WEBFLOW • BOOTSTRAP • MOCKPLUS • FIGMA
    </text>
  </g>
</svg>
