<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design UX Ultra Engine Architecture</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b0f19;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --indigo: #6366f1;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --pink: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .svg-wrapper {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Design UX Ultra Engine &bull; System Architecture</h1>

            <rect x="0" y="0" width="168" height="42" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

            <circle cx="772" cy="21" r="5" fill="#06B6D4"/>

            <text x="708" y="19" fill="#34D399" font-family="monospace" font-size="11">5. Heuristic Audit</text>

        <polygon points="620,306 617,298 623,298" fill="#34D399"/>
        <polygon points="850,306 847,298 853,298" fill="#F472B6"/>

        <g transform="translate(40, 310)">

            <text x="16" y="104" fill="#E2E8F0" font-size="11">&bull; Fitts's Law 44px Targets</text>
            <text x="16" y="124" fill="#E2E8F0" font-size="11">&bull; Hick's Law Chunking</text>
            <text x="16" y="144" fill="#E2E8F0" font-size="11">&bull; Skeleton Shimmer Feedback</text>
            <text x="16" y="164" fill="#E2E8F0" font-size="11">&bull; WCAG 2.2 AAA Contrast</text>
          </g>

          <!-- Pillar 4 -->
          <g transform="translate(702, 0)">
            <rect width="218" height="200" rx="16" fill="#220B1D" stroke="#BE185D" stroke-width="1.5"/>
            <rect x="0" y="0" width="218" height="6" rx="3" fill="#EC4899"/>
            <text x="16" y="32" fill="#F472B6" font-family="monospace" font-size="10" letter-spacing="0.1em">PILLAR 04</text>
            <text x="16" y="54" fill="#FFFFFF" font-weight="700" font-size="16">Figma Tokens</text>
            <line x1="16" y1="82" x2="202" y2="82" stroke="#1E293B" stroke-width="1"/>
            <text x="16" y="104" fill="#E2E8F0" font-size="11">&bull; 3-Tier Semantic Tokens</text>

          </g>

        <!-- Connector -->
        <path d="M150 510V540 M380 510V540 M620 510V540 M850 510V540" stroke="#334155" stroke-width="1.5"/>
        <path d="M150 540H850" stroke="#334155" stroke-width="1.5"/>
        <path d="M500 540V556" stroke="#10B981" stroke-width="2"/>
        <polygon points="500,562 496,554 504,554" fill="#10B981"/>

        <g transform="translate(40, 566)">

          <g transform="translate(24, 18)">

          <g transform="translate(515, 24)">
            <!-- Pill 1: 1000+ Templates -->
            <g transform="translate(0, 0)">

            <g transform="translate(274, 0)">
              <rect width="96" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
              <text x="48" y="23" fill="#34D399" font-family="monospace" font-size="11" text-anchor="middle">Audit CLI</text>

    </div>
  </div>
</body>
</html>
