<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design UX Ultra Engine Architecture v1.2.0</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b0f19;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --indigo: #6366f1;
      --cyan: #06b6d4;
      --purple: #a855f7;
      --emerald: #10b981;
      --pink: #ec4899;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .svg-wrapper {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
