      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Kinetic Ultra Gradient -->
    <linearGradient id="ultraGrad" x1="64" y1="52" x2="192" y2="200" gradientUnits="userSpaceOnUse">
