<!-- Interactive Tactile Buttons - Design UX Ultra -->
<!-- 1. Shimmer Accent Button (Dribbble Showstopper) -->
<button class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-sm font-semibold rounded-2xl group bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 hover:text-white shadow-lg shadow-indigo-500/25 active:scale-95 transition-all">
  <span class="relative px-6 py-3 transition-all ease-out bg-slate-950 rounded-[14px] group-hover:bg-opacity-0">
    <span class="relative text-white flex items-center gap-2">
      <svg class="w-4 h-4 text-indigo-400 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>Deploy Instantly</span>
    </span>
  </span>
</button>

<!-- 2. Magnetic Tactile Pill Button (Webflow Pattern) -->
<button class="px-6 py-3 rounded-full bg-slate-900 border border-slate-700 hover:border-slate-500 text-white font-medium text-sm shadow-xl hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all flex items-center gap-2 group">
  <span>Launch Sandbox</span>
  <svg class="w-4 h-4 text-slate-400 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
</button>

<!-- 3. Glassmorphic Ghost Button -->
<button class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 text-slate-200 hover:text-white text-xs font-semibold backdrop-blur-md transition-all">
  Documentation &rarr;
</button>

<!-- 4. Loading / Async Processing State -->
<button class="px-6 py-3 rounded-xl bg-indigo-600/80 text-white font-medium text-sm flex items-center gap-2 cursor-wait opacity-80" disabled aria-busy="true">
  <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  <span>Synthesizing Tokens...</span>
</button>
