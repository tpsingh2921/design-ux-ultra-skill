<!-- Form Wizard Flow (Mockplus Inspired) - Design UX Ultra -->
<div class="max-w-xl mx-auto p-8 bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl backdrop-blur-xl">
  
  <!-- Step Progress Indicator -->
  <div class="mb-8">
    <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-2">
      <span class="text-indigo-400">Step 2 of 3 &bull; Configuration</span>
      <span class="font-mono text-slate-500">66% Complete</span>
    </div>
    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
      <div class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full w-2/3 transition-all duration-500"></div>
    </div>
  </div>

  <!-- Form Fields -->
  <form class="space-y-6">
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Project Identifier</label>
      <input type="text" value="ultra-production-app" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700/80 text-white text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all font-mono" placeholder="my-app">
      <p class="text-[11px] text-slate-500 mt-1.5">Must be lowercase with hyphens only.</p>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Design Archetype</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col p-4 rounded-2xl border-2 border-indigo-500 bg-indigo-500/5 cursor-pointer">
          <span class="text-sm font-bold text-white">SaaS Bento</span>
          <span class="text-xs text-slate-400 mt-1">Telemetry & metrics</span>
        </label>
        <label class="flex flex-col p-4 rounded-2xl border border-slate-800 bg-slate-950 hover:border-slate-700 cursor-pointer transition-colors">
          <span class="text-sm font-bold text-slate-300">Kinetic Editorial</span>
          <span class="text-xs text-slate-500 mt-1">High-impact typography</span>
        </label>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800/80">
      <button type="button" class="px-5 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-colors">
        &larr; Back
      </button>
      <button type="submit" class="px-7 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/30 transition-all">
        Continue to Deployment &rarr;
      </button>
    </div>
  </form>
</div>
